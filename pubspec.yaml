name: university_assets_app
description: "تطبيق إدارة أصول الجامعة - University Assets Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.2

  # Networking
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^6.0.3

  # Secure Storage for JWT tokens
  flutter_secure_storage: ^9.2.2

  # Localization (AR/EN + RTL)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # UI helpers
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  badges: ^3.1.2
  flutter_slidable: ^3.1.1
  cached_network_image: ^3.3.1

  # Utilities
  equatable: ^2.0.5
  logger: ^2.3.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#2F80ED"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
