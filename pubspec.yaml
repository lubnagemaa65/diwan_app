name: university_assets_app
description: "تطبيق إدارة أصول الجامعة - University Assets Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  badges: ^3.1.2
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.0.3
  cupertino_icons: ^1.0.6

  # Networking
  dio: ^5.4.3+1

  # Utilities
  equatable: ^2.0.5
  fl_chart: ^0.68.0
  flutter:
    sdk: flutter

  # Localization (AR/EN + RTL)
  flutter_localizations:
    sdk: flutter

  # Secure Storage for JWT tokens
  flutter_secure_storage: ^9.2.2
  flutter_slidable: ^3.1.1
  flutter_svg: ^2.0.10+1

  # UI helpers
  google_fonts: ^6.2.1
  intl: 0.20.3
  logger: ^2.3.0
  package_info_plus: ^8.0.0
  pretty_dio_logger: ^1.3.1

  # State Management
  provider: ^6.1.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  lintel: ^0.1.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
